<!DOCTYPE html>
<html>

<head>

<title>Cognitive Load Detection</title>

<style>

body{
text-align:center;
font-family:Arial;
background:#f2f2f2;
}

img{
margin-top:20px;
border:4px solid black;
}

#load{
font-size:22px;
margin-top:15px;
}

#alertBox{
margin-top:20px;
font-size:20px;
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<h2>Real-Time Cognitive Load Detection</h2>

<img src="{{ url_for('video') }}">

<div id="load">Load: Detecting...</div>

<div id="alertBox"></div>

<script>

function updateLoad(){

fetch('/load')
.then(res=>res.json())
.then(data=>{

document.getElementById("load").innerText =
"Current Load: " + data.load;

});

}

function updateAlert(){

fetch('/alert')
.then(res=>res.json())
.then(data=>{

if(data.alert !== ""){

document.getElementById("alertBox").innerText =
"ALERT: " + data.alert;

}

});

}

setInterval(updateLoad,2000);
setInterval(updateAlert,5000);

</script>

</body>

</html>
